name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          pip install flake8 pytest requests databricks-cli
          pip install -r requirements.txt
      
      - name: Lint with flake8
        run: flake8 notebooks/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  deploy:
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install Databricks CLI
        run: |
          pip install databricks-cli requests
      
      - name: Deploy to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WORKSPACE_ID: ${{ secrets.DATABRICKS_WORKSPACE_ID }}
        run: |
          echo "Deploying notebooks to Databricks workspace..."
          
          # Copier les notebooks dans le workspace Databricks
          databricks workspace import-dir ./notebooks /Repos/khalid-eau-pipeline/notebooks --overwrite
          
          # Créer ou mettre à jour le job orchestré
          python scripts/deploy_jobs.py